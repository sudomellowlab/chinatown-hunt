name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Unit tests
        run: node --test

      - name: Build
        run: node build.js

      # archive: false uploads the HTML as-is, so the download is the file itself, not a zip.
      - name: Upload built HTML
        uses: actions/upload-artifact@v7
        with:
          path: dist/chinatown-hunt.html
          archive: false
          if-no-files-found: error
          retention-days: 30

