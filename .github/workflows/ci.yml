name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Unit tests
        run: node --test

      - name: Build
        run: node build.js

      # archive: false uploads each HTML as-is, so the download is the file itself, not a zip.
      - name: Upload the admin file
        uses: actions/upload-artifact@v7
        with:
          path: dist/chinatown-hunt-admin.html
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the participant file (default game)
        uses: actions/upload-artifact@v7
        with:
          path: dist/chinatown-hunt.html
          archive: false
          if-no-files-found: error
          retention-days: 30

  # Playwright against the built file, through the real watchPosition path.
  # The Playwright config's global setup runs node build.js itself.
  browser-tests:
    needs: test-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
