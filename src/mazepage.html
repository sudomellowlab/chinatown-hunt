<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="only light">
<title>Maze</title>
<style>
:root{
  --linen:#DCE0D8; --ink:#16202B; --slate:#5C6B70; --jade:#2E6B5E; --brass:#8A6D2F; --sheet:#E9ECE5;
  --serif:"Hoefler Text","Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif;
  color-scheme:only light;
}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{margin:0;background:var(--linen);color:var(--ink);font-family:var(--serif);
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 24px)}
main{max-width:560px;margin:0 auto}
h1{font-size:24px;line-height:1.15;margin:0 0 4px;font-weight:600}
p.note{font-size:14px;color:var(--slate);margin:0 0 16px}
#mazeGrid{display:block;width:100%;height:auto;max-height:70vh;background:#fff;border:1px solid var(--ink);
  touch-action:none;-webkit-user-select:none;user-select:none}
#mazeGrid .mazewalls line{stroke:var(--ink);stroke-width:.9;stroke-linecap:square}
#mazeGrid #mazeTrail rect{fill:rgba(22,32,43,.12)}
#mazeGrid #mazeTrail rect.route{fill:rgba(46,107,94,.3)}
#mazeGrid #mazeLetters text{font-family:var(--serif);font-size:5px;fill:var(--slate)}
#mazeGrid #mazeLetters text.route{fill:var(--ink);font-weight:700}
#mazeGrid #mazeStart{fill:var(--brass)}
#mazeGrid #mazeHead{fill:none;stroke:var(--brass);stroke-width:1.1}
.mazebtns{display:flex;gap:10px;margin-top:10px}
.mazebtns button{flex:1;min-height:44px;font-family:var(--serif);font-size:15px;
  border:1px solid var(--slate);background:transparent;color:var(--ink)}
.mazebtns button:disabled{opacity:.4}
/* While a finger is walking the maze, the page itself doesn't move under it. */
body.mazetracing{touch-action:none;overscroll-behavior:none}
[hidden]{display:none!important}
p.mazesays{font-size:14px;color:var(--slate);margin:10px 0 0}
p.mazesays.done{font-size:17px;color:var(--ink);font-weight:600;border-left:3px solid var(--jade);
  padding:4px 0 4px 12px;background:rgba(46,107,94,.08)}
button#again{margin-top:14px;width:100%;min-height:48px;font-family:var(--serif);font-size:16px;
  border:1px solid var(--ink);background:transparent;color:var(--ink)}
</style>
</head>
<body>
<main>
  <h1 id="title">Maze</h1>
  <p class="note">Drag a finger (or the mouse) from the gold square and find your way out at the bottom. Every square has a letter; the ones on the way out spell something.</p>
  <div id="here"></div>
  <button type="button" id="again" hidden>Start again</button>
</main>
<script type="module">
// __MODULES__
const MAZE = Pack.open("__MAZE_PACK__");
document.title = MAZE.title || "Maze";
document.getElementById("title").textContent = MAZE.title || "Maze";
const here = document.getElementById("here"), again = document.getElementById("again");
function show(){
  here.replaceChildren();
  const view = MazeView.draw(MAZE.maze, {
    sentence: MAZE.maze.sentence,
    onSolved: () => { view.redraw(true); again.hidden = false; view.says.scrollIntoView({ block: "center" }); },
  });
  here.append(view.grid, view.buttons, view.says);
}
again.onclick = show;
show();
</script>
</body>
</html>
